# ── Frontend ────────────────────────────────────────────────
# The React app lives in /frontend, not under src/main.
quarkus.quinoa.ui-dir=frontend
quarkus.quinoa.build-dir=dist
quarkus.quinoa.dev-server.port=5178
quarkus.quinoa.enable-spa-routing=true

# ── REST ────────────────────────────────────────────────────
# Everything under /api is ours; Quinoa serves the rest.
quarkus.rest.path=/api
quarkus.smallrye-openapi.info-title=Labeleur API
quarkus.http.limits.max-body-size=64M
quarkus.http.limits.max-form-attribute-size=64M

# ── Database ────────────────────────────────────────────────
# Dev and test get PostgreSQL from Dev Services; production sets the URL.
quarkus.datasource.db-kind=postgresql
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=none
# JSON columns (location segments, allergens) use Hibernate's own mapper, not the REST one.
quarkus.hibernate-orm.mapping.format.global=ignore
# Tables and columns in snake_case: InventoryItem.assetTag → inventory_item.asset_tag.
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/labeleur}
%prod.quarkus.datasource.username=${DB_USER:labeleur}
%prod.quarkus.datasource.password=${DB_PASSWORD:labeleur}

# ── Sign-in ─────────────────────────────────────────────────
# Keycloak signs people in. The landing page at / and the static files are
# public; the API, record links (/r/…), /login and /register need a session,
# so opening them signed out goes to Keycloak and back.
# Dev: compose-devservices.yml starts Keycloak on :8180 and Mailpit on :8025.
quarkus.oidc.client-id=labeleur
quarkus.oidc.application-type=web-app
quarkus.oidc.authentication.pkce-required=true
# The owner of a user's data is the subject, not the (changeable) email.
quarkus.oidc.token.principal-claim=sub
quarkus.oidc.token.refresh-expired=true
quarkus.oidc.token-state-manager.split-tokens=true
quarkus.oidc.authentication.restore-path-after-redirect=true
# fetch() can't follow a redirect to Keycloak: requests marked
# X-Requested-With: JavaScript get 499 instead, and the app reloads.
quarkus.oidc.authentication.java-script-auto-redirect=false
quarkus.oidc.logout.path=/logout
quarkus.oidc.logout.post-logout-path=/
quarkus.http.auth.permission.signed-in.paths=/api/*,/r/*,/login,/register,/logout,/q/*
quarkus.http.auth.permission.signed-in.policy=authenticated
%dev.quarkus.oidc.auth-server-url=http://localhost:8180/realms/labeleur
%dev.quarkus.oidc.credentials.secret=labeleur-dev-secret
%dev.quarkus.oidc.connection-delay=60S
%prod.quarkus.oidc.auth-server-url=${OIDC_URL}
%prod.quarkus.oidc.credentials.secret=${OIDC_SECRET}
# Tests sign in with @TestSecurity; no Keycloak, no compose services.
%test.quarkus.oidc.tenant-enabled=false
%test.quarkus.keycloak.devservices.enabled=false
%test.quarkus.compose.devservices.enabled=false

# ── Labeleur ──────────────────────────────────────────────
# Fill the printer list on a fresh database. Each user's sample records are
# set up on their first sign-in; new users start with this organisation as sender.
labeleur.seed-on-start=true
labeleur.organisation.name=Nordlicht Manufaktur GmbH
labeleur.organisation.address.company=Nordlicht Manufaktur GmbH
labeleur.organisation.address.street=Lindwurmstraße
labeleur.organisation.address.house-number=88
labeleur.organisation.address.postal-code=80337
labeleur.organisation.address.city=München
labeleur.organisation.address.country=DE

# Optional record fields are left out of JSON rather than sent as null.
quarkus.jackson.serialization-inclusion=non_null

# Backend tests don't need the UI built.
%test.quarkus.quinoa=false
