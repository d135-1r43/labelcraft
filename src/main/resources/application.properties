# ── Frontend ────────────────────────────────────────────────
# The React app lives in /frontend, not under src/main.
quarkus.quinoa.ui-dir=frontend
quarkus.quinoa.build-dir=dist
quarkus.quinoa.dev-server.port=5178
quarkus.quinoa.enable-spa-routing=true

# ── REST ────────────────────────────────────────────────────
# Everything under /api is ours; Quinoa serves the rest.
quarkus.rest.path=/api
quarkus.smallrye-openapi.info-title=Labelcraft API
quarkus.http.limits.max-body-size=64M
quarkus.http.limits.max-form-attribute-size=64M

# ── Database ────────────────────────────────────────────────
# Dev and test get PostgreSQL from Dev Services; production sets the URL.
quarkus.datasource.db-kind=postgresql
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=none
# JSON columns (location segments, allergens) use Hibernate's own mapper, not the REST one.
quarkus.hibernate-orm.mapping.format.global=ignore
# Tables and columns in snake_case: InventoryItem.assetTag → inventory_item.asset_tag.
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/labelcraft}
%prod.quarkus.datasource.username=${DB_USER:labelcraft}
%prod.quarkus.datasource.password=${DB_PASSWORD:labelcraft}

# ── Labelcraft ──────────────────────────────────────────────
# Fill empty tables with the sample organisation's records on start.
labelcraft.seed-on-start=true
labelcraft.organisation.name=Nordlicht Manufaktur GmbH
labelcraft.organisation.address.company=Nordlicht Manufaktur GmbH
labelcraft.organisation.address.street=Lindwurmstraße
labelcraft.organisation.address.house-number=88
labelcraft.organisation.address.postal-code=80337
labelcraft.organisation.address.city=München
labelcraft.organisation.address.country=DE

# Optional record fields are left out of JSON rather than sent as null.
quarkus.jackson.serialization-inclusion=non_null

# Backend tests don't need the UI built.
%test.quarkus.quinoa=false
