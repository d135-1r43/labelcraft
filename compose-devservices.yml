# Started by Quarkus in dev mode (Compose Dev Services) next to the
# PostgreSQL it starts itself: Keycloak with the Labeleur realm, theme and
# allowlist, and Mailpit to catch verification and password-reset mail.
#
#   App              http://localhost:8080   dev@labeleur.test / labeleur-dev
#   Keycloak admin   http://localhost:8180   admin / admin
#   Mail             http://localhost:8025
#
# The theme is mounted, so edits show on reload. Changes to the realm or the
# extension need `docker compose -f compose-devservices.yml build`.
services:
  keycloak:
    build: ./keycloak
    image: labeleur-keycloak:dev
    command: ["start-dev", "--import-realm"]
    ports:
      - "8180:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: dev-file
      LABELEUR_URL: http://localhost:8080
      LABELEUR_OIDC_SECRET: labeleur-dev-secret
      LABELEUR_REGISTRATION_ALLOWLIST: ${LABELEUR_REGISTRATION_ALLOWLIST:-}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: labeleur@localhost
      SMTP_AUTH: "false"
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      SMTP_STARTTLS: "false"
      SMTP_SSL: "false"
    volumes:
      - ./keycloak/themes/labeleur:/opt/keycloak/themes/labeleur:ro
      # A signed-in user from the first start, imported only in dev.
      - ./keycloak/dev/labeleur-users-0.json:/opt/keycloak/data/import/labeleur-users-0.json:ro
    labels:
      io.quarkus.devservices.compose.wait_for.logs: .*Running the server in development mode.*

  mailpit:
    image: axllent/mailpit:v1.31.4
    ports:
      - "8025:8025"
