# Labelcraft in production: the app, Keycloak and PostgreSQL.
# Copy .env.example to .env, fill it in, then `docker compose up -d`.
#
# Put a TLS-terminating proxy in front and point LABELCRAFT_URL and
# KEYCLOAK_URL at the public addresses.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: labelcraft
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: labelcraft
    volumes:
      - db:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labelcraft"]
      interval: 5s
      retries: 20

  keycloak:
    image: ${LABELCRAFT_REGISTRY:-ghcr.io/d135-1r43}/labelcraft-keycloak:${LABELCRAFT_VERSION:-latest}
    depends_on:
      db:
        condition: service_healthy
    environment:
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: labelcraft
      KC_DB_PASSWORD: ${DB_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_URL}
      # The app reaches Keycloak inside the network; browsers use KEYCLOAK_URL.
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      LABELCRAFT_URL: ${LABELCRAFT_URL}
      LABELCRAFT_OIDC_SECRET: ${OIDC_SECRET}
      LABELCRAFT_REGISTRATION_ALLOWLIST: ${LABELCRAFT_REGISTRATION_ALLOWLIST:-}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_SSL: ${SMTP_SSL:-false}
    ports:
      - "8180:8080"

  app:
    image: ${LABELCRAFT_REGISTRY:-ghcr.io/d135-1r43}/labelcraft:${LABELCRAFT_VERSION:-latest}
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://db:5432/labelcraft
      DB_USER: labelcraft
      DB_PASSWORD: ${DB_PASSWORD}
      OIDC_URL: http://keycloak:8080/realms/labelcraft
      OIDC_SECRET: ${OIDC_SECRET}
      QUARKUS_OIDC_CONNECTION_DELAY: 120S
      QUARKUS_HTTP_PROXY_PROXY_ADDRESS_FORWARDING: "true"
      QUARKUS_HTTP_PROXY_ALLOW_X_FORWARDED: "true"
    ports:
      - "8080:8080"

volumes:
  db:
