name: CI

## main publishes `latest`; a vX.Y.Z tag from `./mvnw release:prepare`
## publishes X.Y.Z, X.Y and X. Pull requests build and test only.
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      ## The typography engine's tests; Quinoa only builds the frontend.
      - name: Test the frontend
        working-directory: frontend
        run: |
          npm ci
          npm test

      ## Formatting check, backend tests against PostgreSQL from Dev Services,
      ## and the frontend built into the jar by Quinoa.
      - name: Build and test
        run: ./mvnw verify -B

      ## The Keycloak provider's own tests; its image build packages it again.
      - name: Test the Keycloak extension
        run: ./mvnw -B -q -f keycloak/extension/pom.xml verify

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/labeleur
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=long

      - name: Keycloak image tags
        id: meta-keycloak
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/labeleur-keycloak
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=long

      ## Into the runner's Docker first, so the next step can start them.
      - name: Build the app image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/main/docker/Dockerfile.jvm
          load: true
          push: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/labeleur:smoke
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build the Keycloak image
        uses: docker/build-push-action@v7
        with:
          context: keycloak
          load: true
          push: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/labeleur-keycloak:smoke
            ${{ steps.meta-keycloak.outputs.tags }}
          labels: ${{ steps.meta-keycloak.outputs.labels }}

      ## The production compose file with the images just built: PostgreSQL,
      ## Keycloak importing the realm, and the app. The script signs in through
      ## the Labeleur login page, reads records and prints a PDF.
      - name: Check the stack serves
        env:
          LABELEUR_REGISTRY: ghcr.io/${{ github.repository_owner }}
        run: |
          set -eu
          docker compose -p smoke --env-file .github/smoke/smoke.env -f deploy/docker-compose.yml up -d
          ok=
          for _ in $(seq 1 90); do
            if curl -fsS -o /dev/null http://localhost:8180/realms/labeleur \
              && [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/)" = 302 ]; then ok=1; break; fi
            sleep 2
          done
          if [ -z "$ok" ]; then docker compose -p smoke logs; echo "The stack never came up." >&2; exit 1; fi
          python3 -I .github/smoke/signin.py || { docker compose -p smoke logs app keycloak | tail -80; exit 1; }

      - name: Stop the stack
        if: always()
        run: docker compose -p smoke -f deploy/docker-compose.yml down -v || true

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      ## The same builds again, from the layers the steps above already made.
      - name: Push the app image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/main/docker/Dockerfile.jvm
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Push the Keycloak image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: keycloak
          push: true
          tags: ${{ steps.meta-keycloak.outputs.tags }}
          labels: ${{ steps.meta-keycloak.outputs.labels }}
